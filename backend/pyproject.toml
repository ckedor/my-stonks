[tool.poetry.group.dev.dependencies]
isort = "6.0.1"
ruff = "0.11.2"
pre-commit = "4.2.0"
pytest = "^8.3.5"
pytest-cov = "^6.1.1"
taskipy = "^1.14.1"
fastapi = {extras = ["standard"], version = "^0.115.12"}
import-linter = "2.6"

[tool.ruff]
line-length = 100
target-version = "py312"
lint.select = ["E", "F", "B", "I", "UP", "SIM", "C4", "RUF", "PL", "PT"]
lint.ignore = [
    # A linha longa é decidida pelo formatter, que só tenta respeitar o limite.
    "E501",
    # Depends() como valor default é o idioma do FastAPI.
    "B008",
    "PLR0911",
    # Comparação com literal: ruído demais num domínio cheio de percentuais.
    "PLR2004",
    # A doc do ruff lista estas como conflitantes com o formatter.
    "W191",
    "E111",
    "E114",
    "E117",
    # Unicode ambíguo em comentário/docstring: aqui são × e − de notação
    # matemática, escritos de propósito. RUF001 (literais) continua ligado,
    # que é onde um caractere sósia viraria bug de verdade.
    "RUF002",
    "RUF003",
]
# Regras em preview são instáveis: o baseline mudaria a cada upgrade do ruff,
# e o pre-commit bloqueia commit. Ficam de fora até estabilizarem.
lint.preview = false
format.preview = true
format.quote-style = 'single'
extend-exclude = ['app/infra/db/alembic/', 'manage.py', 'app/main.py']

[tool.pytest.ini_options]
pythonpath = "."
addopts = '-p no:warnings'
# Sem isto todo teste async precisa carregar @pytest.mark.asyncio.
asyncio_mode = "auto"
# Sem isto, cada fixture async pode receber seu próprio event loop, e uma conexão
# asyncpg aberta numa fixture falha ao ser usada noutra com
# "got Future attached to a different loop".
asyncio_default_fixture_loop_scope = "function"
markers = [
    "unit: sem IO — domínio, lib e serviço com dublê",
    "integration: precisa do Postgres de teste ou de resposta gravada",
    "e2e: sobe a app e entra por HTTP",
    "contract: compara o contrato publicado com o snapshot versionado",
]

[tool.coverage.run]
source = ['app']
branch = true
omit = [
    'app/infra/db/alembic/*',
    'app/lib/finance/main.py',
    'manage.py',
]

[tool.coverage.report]
show_missing = true
exclude_also = [
    'if TYPE_CHECKING:',
    'raise NotImplementedError',
    '@(abc\.)?abstractmethod',
]

[tool.taskipy.tasks]
run = 'fastapi dev app/main.py --port 7000'
pre_test = 'task lint'
test = 'pytest --cov=app -vv'
post_test = 'coverage html'
lint = 'ruff check . && ruff check . --diff'
check = 'ruff check . ; lint-imports --config .importlinter ; pytest -q'
test_unit = 'pytest -q -m unit'
test_integration = 'pytest -q -m integration'
test_e2e = 'pytest -q -m e2e'
test_contract = 'pytest -q -m contract'
openapi_update = 'env ENVIRONMENT=testing python tests/contract/test_openapi_snapshot.py'
coverage = 'pytest -q --cov --cov-report=term-missing'
db_test_up = 'docker compose up -d db_test'
db_test_down = 'docker compose stop db_test'
architecture = 'lint-imports --config .importlinter'
format = 'ruff check . --fix && ruff format .'
create_migration = 'alembic revision --autogenerate -m' 
migrate = 'alembic upgrade head'

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
