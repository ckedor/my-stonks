services:
  db:
    image: postgres:14
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: roots123
      POSTGRES_DB: my-stonks-api-db
    ports:
      - "5432:5432"
    volumes:
      - stonks_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d my-stonks-api-db"]
      interval: 2s
      timeout: 5s
      retries: 15

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  db_test:
    image: postgres:14
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: roots123
      POSTGRES_DB: my-stonks-api-db-test
    ports:
      - "5434:5432"
    volumes:
      - stonks_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Storage dos documentos da carteira em desenvolvimento: fala S3, como o
  # bucket de produção, e aceita qualquer credencial. O bucket nasce com o
  # container — o adapter não cria bucket, só grava num que existe.
  document_storage:
    image: adobe/s3mock:latest
    # A imagem roda sem root e não consegue escrever num volume nomeado.
    user: "0:0"
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: my-stonks-documents
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /data
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: "true"
    ports:
      - "9090:9090"
    volumes:
      - document_storage_data:/data

  redisinsight:
    image: redis/redisinsight:latest
    container_name: redisinsight
    ports:
      - "8001:5540"
    depends_on:
      - redis

volumes:
  stonks_data:
  redis_data:
  stonks_test_data:
  document_storage_data:
