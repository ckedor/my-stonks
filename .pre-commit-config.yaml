# Este repositório é de desenvolvedor único e não tem CI remoto: estes hooks
# SÃO o CI. É a única barreira automática entre o código e o repositório, então
# ela existe principalmente para cercar o que um agente faz sem perceber.
#
# Instale os dois tipos de hook — sem o segundo, metade dos gates nunca roda:
#
#     pre-commit install --hook-type pre-commit --hook-type pre-push
#
# Todos os hooks rodam os binários do venv do backend e do node_modules do
# frontend (language: system), e não em ambientes que o pre-commit monta por
# fora. Assim a versão que roda no commit é a mesma que você roda na mão.
#
# ── Onde cada check roda ───────────────────────────────────────────────────
# COMMIT: só o que olha o arquivo que você acabou de mexer e responde na hora —
#         ruff, eslint, ds-baseline e a regra de importação (lint-imports).
# PUSH:   tudo que varre o projeto inteiro ou executa código: knip, vitest,
#         pytest, tsc + build e a regressão visual. É lento demais para pagar
#         a cada commit, mas nada sai daqui sem passar.
#
# ── Bloqueia ou não ────────────────────────────────────────────────────────
# O critério é: check verde entra bloqueando, check vermelho entra reportando
# até ficar verde. Hoje só pytest e lint-imports rodam com `|| true`, porque
# ainda falham. Para torná-los bloqueantes, remova o `|| true` do `entry`.
#
# O knip aplica esse mesmo critério por categoria, em `frontend/knip.jsonc`:
# arquivo e dependência sem uso bloqueiam; export e tipo ainda reportam.
#
# O ruff e o eslint recebem só os arquivos staged, então são naturalmente
# incrementais — você limpa cada arquivo conforme encosta nele.
#
# O ds-baseline guarda a fronteira do design system:
# `frontend/eslint-ds-baseline.json` lista os arquivos que ainda podem importar
# MUI, e essa lista só encolhe. Ver o cabeçalho de `frontend/eslint.config.js`.

default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: local
    hooks:
      # ── pre-commit ───────────────────────────────────────────────────────
      - id: ruff-check
        name: ruff check (staged files)
        entry: backend/.venv/bin/ruff check --force-exclude --fix
        language: system
        types: [python]
        files: ^backend/

      - id: ruff-format
        name: ruff format (staged files)
        entry: backend/.venv/bin/ruff format --force-exclude
        language: system
        types: [python]
        files: ^backend/

      - id: eslint
        name: eslint (staged files)
        # O pre-commit passa caminhos a partir da raiz do repo; o eslint roda
        # dentro de frontend/, então o prefixo sai de cada argumento.
        entry: bash -c 'cd frontend && npx eslint --no-warn-ignored "${@#frontend/}"' --
        language: system
        files: ^frontend/(src|e2e)/.*\.(ts|tsx)$

      - id: ds-baseline
        name: design system ratchet
        entry: bash -c 'cd frontend && npm run --silent lint:ds'
        language: system
        pass_filenames: false
        files: ^frontend/
        verbose: true

      - id: lint-imports
        name: lint-imports / task architecture (não bloqueia)
        entry: bash -c 'cd backend && PATH="$PWD/.venv/bin:$PATH" task architecture || true'
        language: system
        pass_filenames: false
        always_run: true
        verbose: true

      # ── pre-push ─────────────────────────────────────────────────────────
      - id: knip
        name: knip / código morto
        entry: bash -c 'cd frontend && npx knip --no-progress'
        language: system
        pass_filenames: false
        files: ^frontend/
        verbose: true
        stages: [pre-push]

      - id: vitest
        name: vitest (frontend)
        entry: bash -c 'cd frontend && npm run --silent test'
        language: system
        pass_filenames: false
        files: ^frontend/
        verbose: true
        stages: [pre-push]

      - id: pytest
        name: pytest (não bloqueia)
        entry: bash -c 'cd backend && .venv/bin/python -m pytest -q || true'
        language: system
        pass_filenames: false
        always_run: true
        verbose: true
        stages: [pre-push]

      - id: frontend-build
        name: tsc + vite build
        entry: bash -c 'cd frontend && npm run --silent build'
        language: system
        pass_filenames: false
        files: ^frontend/
        stages: [pre-push]
        verbose: true

      - id: visual-regression
        name: playwright / regressão visual
        # Sobe o dev server sozinho e mocka a API inteira: não depende do
        # backend estar de pé. Precisa do browser uma vez:
        #     cd frontend && npx playwright install chromium
        entry: bash -c 'cd frontend && npm run --silent e2e'
        language: system
        pass_filenames: false
        files: ^frontend/
        stages: [pre-push]
        verbose: true
