# Todos os hooks rodam os binários do venv do backend (language: system), e não
# em ambientes que o pre-commit monta por fora. Assim a versão que roda no commit
# é a mesma que você roda na mão via `task`.
#
# Bloqueio: tudo bloqueia, menos pytest e lint-imports.
# O ruff e o eslint recebem só os arquivos staged, então são naturalmente
# incrementais — você limpa cada arquivo conforme encosta nele. pytest e
# lint-imports são globais e hoje falham, então rodam com `|| true`: reportam e
# deixam passar. Para torná-los bloqueantes, remova o `|| true` do `entry`.
#
# O vitest e o ds-baseline também são globais, mas bloqueiam, porque hoje
# passam — 68 testes e a fronteira do design system limpa. O critério é esse:
# check verde entra bloqueando, check vermelho entra reportando até ficar
# verde.
#
# O ds-baseline guarda a fronteira do design system:
# `frontend/eslint-ds-baseline.json` lista os arquivos que ainda podem importar
# MUI, e essa lista só encolhe. Ver o cabeçalho de `frontend/eslint.config.js`.

repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check (staged files)
        entry: backend/.venv/bin/ruff check --force-exclude --fix
        language: system
        types: [python]
        files: ^backend/

      - id: ruff-format
        name: ruff format (staged files)
        entry: backend/.venv/bin/ruff format --force-exclude
        language: system
        types: [python]
        files: ^backend/

      - id: eslint
        name: eslint (staged files)
        # O pre-commit passa caminhos a partir da raiz do repo; o eslint roda
        # dentro de frontend/, então o prefixo sai de cada argumento.
        entry: bash -c 'cd frontend && npx eslint --no-warn-ignored "${@#frontend/}"' --
        language: system
        files: ^frontend/src/.*\.(ts|tsx)$

      - id: ds-baseline
        name: design system ratchet
        entry: bash -c 'cd frontend && npm run --silent lint:ds'
        language: system
        pass_filenames: false
        files: ^frontend/
        verbose: true

      - id: pytest
        name: pytest (não bloqueia)
        entry: bash -c 'cd backend && .venv/bin/python -m pytest -q || true'
        language: system
        pass_filenames: false
        always_run: true
        verbose: true

      - id: vitest
        name: vitest (frontend)
        entry: bash -c 'cd frontend && npm run --silent test'
        language: system
        pass_filenames: false
        files: ^frontend/
        verbose: true

      - id: lint-imports
        name: lint-imports / task architecture (não bloqueia)
        entry: bash -c 'cd backend && PATH="$PWD/.venv/bin:$PATH" task architecture || true'
        language: system
        pass_filenames: false
        always_run: true
        verbose: true
